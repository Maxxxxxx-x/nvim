name: Auto update dotfiles nvim submodule

on:
  push:
    branches: [main]

jobs:
  update_repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dotfiles repository
        uses: actions/checkout@v4
        with:
          repository: Maxxxxxx-x/dotfiles
          token: ${{ secrets.DOTFILES_REPO_TOKEN }}
          submodules: true
          ref: master
          fetch-depth: 1

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update Neovim submodule
        id: update
        run: |
          # Fetch and checkout the latest commit of the submodule
          git submodule update --init --remote --force nvim

          # Check for staged or unstaged changes in the submodule reference
          if git diff --quiet HEAD -- nvim; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected in nvim submodule."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git add nvim
            LEFTHOOK=0 git commit --no-verify -m "chore: bump submodule to Maxxxxxx-x/nvim@${{ github.sha }}"
          fi

      - name: Push changes
        if: steps.update.outputs.changed == 'true'
        run: git push origin HEAD:master
